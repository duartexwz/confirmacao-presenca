[project]
name = "back"
version = "0.1.0"
description = ""
authors = [
    {name = "duartexwz",email = "mayckonkennedy877@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.13, < 4.0"
dependencies = [
    "pytest (>=9.2.0,<10.0.0)",
    "fastapi (>=0.165.0,<0.166.0)",
    "asyncpg (>=0.32.0,<0.33.0)",
    "asyncio (>=4.0.0,<5.0.0)",
    "pydantic (>=2.14.4,<3.0.0)",
    "pydantic-settings (>=2.16.3,<3.0.0)",
    "psycopg[binary,pool] (>=3.3.9,<4.0.0)",
    "uvicorn[standard] (>=0.34.0,<1.0.0)",
    "pwdlib[argon2] (>=0.4.2,<0.5.0)",
    "pyjwt (>=2.15.1,<3.0.0)",
    "slowapi (>=0.1.10,<0.2.0)",
    "python-multipart (>=0.0.9,<0.1.0)"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["api"]

[dependency-groups]
dev = [
    "taskipy (>=1.14.1,<2.0.0)",
    "ruff (>=0.17.6,<0.18.0)",
    "pytest-coverage (>=0.0,<0.1)"
]

[tool.ruff]
line-length = 120

[tool.ruff.format]
quote-style = "double"


[tool.ruff.lint]
select = ["E", "F", "I", "B", "F401"]

[tool.ruff.lint.per-file-ignores]
"api/routers/*.py" = ["B008"]
"api/services/*.py" = ["F841"]
"api/security.py" = ["B904"]

[tool.taskipy.tasks]

lint = "ruff check ."
format = "ruff check --fix && ruff format ."
test = "ruff check . &&  pytest-cov=api"
run = "uvicorn api.main:app --reload"