# Configuração Nginx para SPA React.
# Redireciona todas as rotas para index.html para funcionar com client-side routing.

server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Compressão gzip para melhorar performance
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;

    # Arquivos estáticos com cache longo (Vite gera hashes nos nomes)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback — qualquer rota não encontrada retorna index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
